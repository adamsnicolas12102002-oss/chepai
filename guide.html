<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>使用说明</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #102344;
      background: linear-gradient(180deg, #eaf4ff 0, #f7fbff 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .page {
      width: min(430px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px 15px 34px;
    }
    .top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .back {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 12px;
      color: #1264f5;
      background: #fff;
      box-shadow: 0 10px 22px rgba(45, 92, 158, .12);
      font-size: 24px;
      text-decoration: none;
      font-weight: 900;
    }
    h1 {
      margin: 0;
      color: #071735;
      font-size: 24px;
      font-weight: 950;
      letter-spacing: 0;
    }
    .hero {
      padding: 20px 18px;
      border-radius: 18px;
      color: #fff;
      background: linear-gradient(135deg, #1264f5, #0c8bff);
      box-shadow: 0 18px 40px rgba(18, 100, 245, .24);
    }
    .hero strong {
      display: block;
      margin-bottom: 7px;
      font-size: 21px;
      font-weight: 950;
    }
    .hero p {
      margin: 0;
      color: rgba(255, 255, 255, .86);
      font-size: 14px;
      line-height: 1.7;
      font-weight: 700;
    }
    .card {
      margin-top: 13px;
      padding: 16px;
      border: 1px solid #dce8fb;
      border-radius: 16px;
      background: rgba(255, 255, 255, .95);
      box-shadow: 0 14px 34px rgba(45, 92, 158, .11);
    }
    .card h2 {
      margin: 0 0 10px;
      color: #0a1c3a;
      font-size: 17px;
      font-weight: 950;
    }
    .row {
      display: grid;
      grid-template-columns: 74px 1fr;
      gap: 10px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #edf3fc;
    }
    .row:last-child { border-bottom: 0; }
    .plate {
      display: grid;
      place-items: center;
      height: 32px;
      border-radius: 6px;
      color: #fff;
      font-size: 15px;
      font-weight: 950;
      letter-spacing: 0;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.25);
    }
    .green { background: #0ca666; }
    .blue { background: #1264f5; }
    .yellow { color: #553000; background: #ffbd27; }
    .row p {
      margin: 0;
      color: #536783;
      font-size: 13px;
      line-height: 1.55;
      font-weight: 750;
    }
    .tips {
      margin: 0;
      padding-left: 18px;
      color: #536783;
      font-size: 14px;
      line-height: 1.8;
      font-weight: 750;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="top">
      <a class="back" href="index.html" aria-label="返回">‹</a>
      <h1>使用说明</h1>
    </div>

    <section class="hero">
      <strong>先选颜色，再看字母</strong>
      <p>本工具根据车牌颜色和车牌号段快速判断归属地与车辆类型，适合手机 H5 查询。</p>
    </section>

    <section class="card">
      <h2>车辆类型判断</h2>
      <div class="row">
        <span class="plate green">绿牌</span>
        <p>D/A/B/C/E 为纯电动汽车；F/G/H/J/K 为非纯电动汽车，包含插混、增程等。</p>
      </div>
      <div class="row">
        <span class="plate blue">蓝牌</span>
        <p>直接按油车判断。</p>
      </div>
      <div class="row">
        <span class="plate yellow">黄牌</span>
        <p>直接按油车判断，并注意货车、客车等通行限制。</p>
      </div>
    </section>

    <section class="card">
      <h2>怎么使用</h2>
      <ul class="tips">
        <li>输入车牌，例如：京AD12345、沪AF12345。</li>
        <li>点击省份后，下方会显示对应省份车牌号段。</li>
        <li>点击车牌样例会自动回填并刷新查询结果。</li>
        <li>拍照识别入口可调用相机或上传图片，后续可接 OCR 接口。</li>
      </ul>
    </section>
  </main>
</body>
</html>
